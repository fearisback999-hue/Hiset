<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>HiSET Writing Prep</title>
  <meta name="description" content="Study app to ace the HiSET Language Arts – Writing exam. Lessons, practice tests, essay lab, and more.">
  <meta name="theme-color" content="#3b82f6">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-gramm="false" data-gramm_editor="false" data-enable-grammarly="false">

  <header id="main-header">
    <div>
      <div class="app-title">HiSET Writing Prep</div>
      <p class="app-tagline">AI-Powered · Lessons · Practice Tests · Essay Lab</p>
    </div>
    <div id="ai-badge" class="ai-badge" onclick="navigate('ai-setup')"></div>
  </header>

  <main id="app" role="main">
    <!-- Rendered by app.js -->
  </main>

  <nav id="bottom-nav" aria-label="Main navigation">
    <button class="nav-item active" data-view="home" onclick="navigate('home')">
      <span class="nav-icon">🏠</span>
      <span>Home</span>
    </button>
    <button class="nav-item" data-view="lessons" onclick="navigate('lessons')">
      <span class="nav-icon">📚</span>
      <span>Lessons</span>
    </button>
    <button class="nav-item" data-view="practice" onclick="navigate('practice')">
      <span class="nav-icon">✏️</span>
      <span>Practice</span>
    </button>
    <button class="nav-item" data-view="official" onclick="navigate('official')">
      <span class="nav-icon">🏛️</span>
      <span>Official</span>
    </button>
    <button class="nav-item" data-view="essay" onclick="navigate('essay')">
      <span class="nav-icon">📝</span>
      <span>Essay</span>
    </button>
    <button class="nav-item" data-view="progress" onclick="navigate('progress')">
      <span class="nav-icon">📊</span>
      <span>Progress</span>
    </button>
  </nav>

  <!-- Data -->
  <script src="js/data/questions.js"></script>
  <script src="js/data/lessons.js"></script>
  <script src="js/data/essayskills.js"></script>

  <!-- App -->
  <script src="js/ai.js"></script>
  <script src="js/grader.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
